<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
<title>Present Perfect Worksheets</title>
<style>
*{box-sizing:border-box}body{margin:0;font-family:system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif;background:#fff7fb;color:#1f2937}.wrap{max-width:760px;margin:auto;padding:22px 16px 40px}.card{background:#fff;border-radius:22px;padding:20px;box-shadow:0 8px 28px rgba(30,41,59,.10);border:1px solid #f3d7e6}h1{font-size:clamp(24px,6vw,36px);margin:0 0 6px;color:#5b2a9d}.sub{margin:0 0 18px;color:#64748b}.lessonLabel{font-weight:800;margin:4px 0 8px}.choices{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:10px}.choice{position:relative}.choice input{position:absolute;opacity:0;pointer-events:none}.choice label{display:block;margin:0;border:2px solid #e5e7eb;border-radius:15px;padding:13px 14px;cursor:pointer;background:#fff;font-weight:800;line-height:1.25}.choice small{display:block;font-weight:600;color:#64748b;margin-top:4px}.choice input:checked+label{border-color:#7c3aed;background:#f5f3ff;color:#5b21b6;box-shadow:0 0 0 2px rgba(124,58,237,.08)}label.field{font-weight:700;display:block;margin:14px 0 6px}.row{display:grid;grid-template-columns:1fr 1fr;gap:12px}input.text{width:100%;font-size:18px;padding:13px 14px;border:2px solid #e5e7eb;border-radius:13px;outline:none}input.text:focus{border-color:#a78bfa}.buttons{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:18px}.btn{border:0;border-radius:14px;padding:14px 12px;font-size:17px;font-weight:800;cursor:pointer;text-align:center}.preview{background:#ede9fe;color:#5b21b6}.download{background:#5b2a9d;color:#fff}.open{display:block;width:100%;margin-top:10px;background:#fce7f3;color:#9d174d}.note{font-size:13px;color:#64748b;margin:12px 0 0;line-height:1.45}.status{min-height:24px;margin-top:10px;font-weight:700;color:#be185d}#previewBox{display:none;margin-top:18px}#previewTitle{font-weight:800;margin:0 0 8px;color:#475569}#previewImg{width:100%;height:auto;border-radius:14px;border:1px solid #e5e7eb;background:#fff}@media(max-width:560px){.choices,.row,.buttons{grid-template-columns:1fr}.card{padding:16px}}
</style>
</head>
<body><div class="wrap"><div class="card">
<h1>Present Perfect Worksheets</h1>
<p class="sub">Personalized Worksheets • PNG Download</p>
<div class="lessonLabel">Choose your worksheet</div>
<div class="choices">
  <div class="choice"><input type="radio" name="ws" id="ws1" value="1" checked><label for="ws1">Lesson 1<small>Present Perfect Progressive</small></label></div>
  <div class="choice"><input type="radio" name="ws" id="ws2" value="2"><label for="ws2">Lesson 2<small>Present Perfect Simple — Exit Worksheet</small></label></div>
</div>
<label class="field" for="name">Full Name</label><input class="text" id="name" autocomplete="name" placeholder="e.g. PATTAREEYA LABPOO" />
<div class="row">
  <div><label class="field" for="no">No.</label><input class="text" id="no" inputmode="numeric" placeholder="e.g. 1" /></div>
  <div><label class="field" for="cls">Class M.5/</label><input class="text" id="cls" inputmode="numeric" placeholder="e.g. 1" /></div>
</div>
<div class="buttons"><button class="btn preview" id="previewBtn">Preview Worksheet</button><button class="btn download" id="downloadBtn">Download PNG</button></div>
<button class="btn open" id="openBtn">Open PNG (mobile/tablet backup)</button>
<p class="note">If your phone blocks the download, tap <b>Open PNG</b>, then press and hold the image and choose Save/Download Image.</p>
<div class="status" id="status"></div>
<div id="previewBox"><p id="previewTitle">Worksheet preview</p><img id="previewImg" alt="Worksheet preview" /></div>
</div></div>
<script>
const $=id=>document.getElementById(id);
function worksheet(){return document.querySelector('input[name="ws"]:checked').value}
function values(){return {worksheet:worksheet(),name:$('name').value.trim(),no:$('no').value.trim(),cls:$('cls').value.trim()}}
function url(preview=false){const v=values();const p=new URLSearchParams({worksheet:v.worksheet,name:v.name,no:v.no,class:v.cls});if(preview)p.set('preview','1');return '/api/create-worksheet?'+p.toString()}
function valid(){const v=values();if(!v.name||!v.no||!v.cls){$('status').textContent='Please enter Full Name, No., and Class.';return false}$('status').textContent='';return true}
function resetPreview(){ $('previewBox').style.display='none'; $('previewImg').removeAttribute('src'); $('status').textContent=''; }
document.querySelectorAll('input[name="ws"]').forEach(el=>el.addEventListener('change',resetPreview));
$('previewBtn').onclick=()=>{if(!valid())return;const img=$('previewImg');$('status').textContent='Creating preview...';$('previewTitle').textContent=worksheet()==='1'?'Lesson 1 — Present Perfect Progressive':'Lesson 2 — Present Perfect Simple';img.onload=()=>{$('status').textContent='';};img.onerror=()=>{$('status').textContent='Preview could not be created. Please try again.';};img.src=url(true)+'&t='+Date.now();$('previewBox').style.display='block';$('previewBox').scrollIntoView({behavior:'smooth',block:'start'})};
$('downloadBtn').onclick=()=>{if(!valid())return;window.location.href=url(false)};
$('openBtn').onclick=()=>{if(!valid())return;window.open(url(true)+'&t='+Date.now(),'_blank')};
</script>
</body></html>
